name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake \
            bison flex libsqlite3-dev sqlite3 valgrind

      - name: Bootstrap (autoreconf)
        run: autoreconf -i

      - name: Configure (out-of-tree)
        run: |
          mkdir build
          cd build
          ../configure

      # No -j, per project convention.
      - name: Build
        run: make -C build

      # make check runs the whole suite, including the valgrind leak check.
      - name: Test suite (make check)
        run: make -C build check

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/tests/*.log
          if-no-files-found: ignore
